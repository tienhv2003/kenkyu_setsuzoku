# Config cho Step 02 - Edge Detection & Super Resolution
# Cấu hình xử lý ảnh biển số: auto-cut và super resolution

# Đường dẫn input/output
paths:
  # Input: Thư mục chứa ảnh biển số đã cắt từ Step 1
  # Có thể là output của Step 1 hoặc thư mục tùy chỉnh
  input_dir: "../data/output/cropped_plates_polygon"
  
  # Output: Thư mục lưu ảnh sau khi auto-cut (perspective correction)
  output_cut_dir: "data/plates_after_cut/auto"
  
  # Output: Thư mục lưu ảnh sau khi super resolution
  output_super_resolution_dir: "data/plates_after_cut_super_resolution/auto"

# Cấu hình xử lý ảnh
processing:
  # Canny edge detection parameters
  canny:
    blur_kernel_size: 5  # Gaussian blur kernel (phải là số lẻ)
    
    # Threshold cố định (dùng khi adaptive_threshold = false)
    threshold1: 75       # Canny threshold 1 (low threshold)
    threshold2: 200      # Canny threshold 2 (high threshold)
    
    # Tự động điều chỉnh threshold theo từng ảnh
    adaptive_threshold: true  # Bật/tắt adaptive threshold (true/false)
    adaptive_method: "percentile"  # Phương pháp: "percentile", "median", "otsu"
    
    # Cấu hình cho adaptive threshold (method = "percentile")
    adaptive_low_percentile: 10   # Percentile thấp cho threshold1 (0-100)
    adaptive_high_percentile: 30  # Percentile cao cho threshold2 (0-100)
    
    # Tỷ lệ giữa threshold2 và threshold1 (dùng cho method = "median" hoặc "otsu")
    threshold_ratio: 2.67  # Tỷ lệ threshold2/threshold1 (mặc định: 200/75 ≈ 2.67)
    
    # Giới hạn giá trị threshold (để tránh quá thấp hoặc quá cao)
    min_threshold1: 30   # Giá trị tối thiểu cho threshold1
    max_threshold1: 150  # Giá trị tối đa cho threshold1
    min_threshold2: 80   # Giá trị tối thiểu cho threshold2
    max_threshold2: 300  # Giá trị tối đa cho threshold2
    
    # Margin để mở rộng vùng cắt (bỏ phần cắt viền thừa)
    # 0.0 = cắt sát biển số (như cũ)
    # 0.1-1.0 = margin theo tỷ lệ (ví dụ: 0.2 = 20% mỗi bên)
    # >1.0 = margin theo pixel (ví dụ: 10 = 10 pixel mỗi bên)
    crop_margin: 0.2  # Mặc định 20% margin để giữ lại nhiều thông tin hơn
    
    # Bỏ qua Canny edge detection (chỉ copy ảnh, không xử lý)
    # true = bỏ qua Canny, copy ảnh trực tiếp (dùng khi nhiều ảnh không detect được)
    # false = dùng Canny edge detection (mặc định)
    skip_canny_detection: true  # BẬT để bỏ qua Canny, giữ lại tất cả ảnh
  
  # Contour detection
  contour:
    approx_epsilon: 0.02  # Epsilon cho approxPolyDP (0.02 = 2% của perimeter)
    min_area: 100         # Diện tích tối thiểu của contour
  
  # Super resolution model
  super_resolution:
    model_name: "fsrcnn"  # Tên model: fsrcnn, espcn, edsr, lapsrn
    scale: 4              # Scale factor: 2, 3, 4 (hoặc 8 cho lapsrn)
    model_path: "models/super_resolution/FSRCNN_x4.pb"

# Cấu hình output
output:
  # Format ảnh đầu ra
  image_format: "jpg"  # jpg, png
  
  # Chất lượng JPEG (1-100)
  jpeg_quality: 95
  
  # Có lưu ảnh trung gian (sau auto-cut) không
  save_intermediate: true
  
  # Có bỏ qua ảnh nếu không tìm thấy contour không
  skip_failed_detection: true

# Logging
logging:
  verbose: true  # In chi tiết quá trình xử lý
  save_log: false  # Lưu log ra file
  log_file: "processing.log"

